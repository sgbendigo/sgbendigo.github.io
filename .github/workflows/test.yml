name: Test Voltello
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          K="${{ secrets.VE_KEY }}"
          C="${{ secrets.VE_CONTEXT }}"
          P="https://acapi.vecddevau1.village.energy/xv1"

          echo "context is ${#C} characters"
          echo ""
          echo "===== service points ====="
          curl -s -w "\nSTATUS: %{http_code}\n" -H "apiKey: $K" \
            "$P/get/customer/energy/electricity/servicepoints/$C"
