name: Test Voltello
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          K="${{ secrets.VE_KEY }}"
          C="${{ secrets.VE_CONTEXT }}"
          P="https://acapi.vecddevau1.village.energy/xv1"
          S="48204df7-ded8-4672-9722-7eb4b9f0399d"
          B="$P/get/customer/energy/electricity/servicepoints/$S"
          T=$(date -u +%Y-%m-%d)

          echo "===== realtime, no params"
          curl -s -w "\nSTATUS: %{http_code}\n" -H "apiKey: $K" "$B/usage/realtime/$C"

          echo ""
          echo "===== 5-min, per endpoint"
          curl -s -H "apiKey: $K" \
            "$B/usage/$C?fromDate=$T&toDate=$T&returnData=aligned5minRead&returnAllTelemetry=true&includeEndPoints=true" \
          | jq -c '.data.reads[] | {
              type, endPointId, nickName,
              intervals: (.intervalRead.intervalReads｜length),
              lastThree: (.intervalRead.intervalReads | map(select(. != null)) | .[-3:]),
              total: .intervalRead.aggregateValue }'
