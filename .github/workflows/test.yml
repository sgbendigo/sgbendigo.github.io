name: Test Voltello
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          K="${{ secrets.VE_KEY }}"
          P="https://acapi.vecddevau1.village.energy/xv1"

          try () {
            echo ""
            echo "===== $1"
            curl -s -w "\nSTATUS: %{http_code}\n" -H "apiKey: $K" "$P$1"
          }

          try "/get/energy/electricity/servicepoints/Voltello"
          try "/get/energy/electricity/der/Voltello"
          try "/get/energy/electricity/usage/telemetry/Voltello"
          try "/get/customer/energy/electricity/servicepoints/Voltello/CUSTOMERS/Individual/00000000-0000-0000-0000-000000000000"
