name: Test Voltello
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          K="${{ secrets.VE_KEY }}"
          C="${{ secrets.VE_CONTEXT }}"
          P="https://acapi.vecddevau1.village.energy/xv1"
          S="48204df7-ded8-4672-9722-7eb4b9f0399d"
          B="$P/get/customer/energy/electricity/servicepoints/$S"
          T=$(date -u +%Y-%m-%d)

          try () {
            echo ""
            echo "===== $2"
            curl -s -w "\nSTATUS: %{http_code}\n" -H "apiKey: $K" "$1"
          }

          try "$B/usage/realtime/$C?aggregateByType=true&includeEndPoints=true" "REALTIME"
          try "$B/der/$C" "DER"
          try "$B/usage/$C?fromDate=$T&toDate=$T&returnData=dailyTotal&aggregateByType=true&returnAllTelemetry=true" "TODAY"
