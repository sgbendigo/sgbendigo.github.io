name: Test Voltello
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Try everything
        run: |
          K="${{ secrets.VE_KEY }}"
          C="${{ secrets.VE_CUSTOMER }}"
          P="https://acapi.vecddevau1.village.energy/xv1"

          try () {
            echo ""
            echo "=============================================="
            echo "TRY: $1"
            echo "=============================================="
            curl -s -w "\nSTATUS: %{http_code}\n" -H "apiKey: $K" "$P$1"
          }

          try "/get/customer/energy/electricity/servicepoints/Voltello/CUSTOMERS/Individual/$C"
          try "/get/customer/energy/electricity/servicepoints/Voltello/CUSTOMERS/Individual"
          try "/get/customer/energy/electricity/servicepoints/Voltello/CUSTOMERS"
          try "/get/customer/energy/electricity/servicepoints/Voltello"
          try "/get/customer/energy/electricity/servicepoints/$C"
          try "/get/customer/energy/electricity/servicepoints/Voltello/CUSTOMERS/Individual/$C/"
          try "/get/customer/contracts/tiles/Voltello/CUSTOMERS/Individual/$C"
