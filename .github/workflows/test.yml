name: Test Voltello
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          K="${{ secrets.VE_KEY }}"
          C="${{ secrets.VE_CONTEXT }}"
          U="${{ secrets.VE_CUSTOMER }}"
          P="https://acapi.vecddevau1.village.energy/xv1"
          B="$P/get/customer/energy/electricity/servicepoints/$C"

          echo "context ${#C} chars, customerId ${#U} chars"

          try () {
            echo ""
            echo "===== $2"
            curl -s -w "\nSTATUS: %{http_code}\n" -H "apiKey: $K" "$1"
          }

          try "$B"               "no filter"
          try "$B?customerId=$U" "filtered by customerId"
          try "$B/"              "trailing slash"
