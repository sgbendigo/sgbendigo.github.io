name: Test Voltello
on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          K="${{ secrets.VE_KEY }}"
          C="${{ secrets.VE_CONTEXT }}"
          P="https://acapi.vecddevau1.village.energy/xv1"
          S="48204df7-ded8-4672-9722-7eb4b9f0399d"
          B="$P/get/customer/energy/electricity/servicepoints/$S"
          T=$(date -u +%Y-%m-%d)

          echo "===== A. realtime, no params"
          curl -s -w "\nSTATUS: %{http_code}\n" -H "apiKey: $K" "$B/usage/realtime/$C"

          echo ""
          echo "===== B. 5-min per endpoint"
          curl -s -H "apiKey: $K" \
            "$B/usage/$C?fromDate=$T&toDate=$T&returnData=aligned5minRead&returnAllTelemetry=true&includeEndPoints=true" \
            > /tmp/five.json
          jq -c '.data.reads[] | {t:.type, id:.endPointId, nick:.nickName, n:(.intervalRead.intervalReads|length), last:(.intervalRead.intervalReads|map(select(.!=null))|.[-3:]), agg:.intervalRead.aggregateValue}' /tmp/five.json \
            || head -c 1500 /tmp/five.json

          echo ""
          echo "===== C. 5-min aggregated by type"
          curl -s -H "apiKey: $K" \
            "$B/usage/$C?fromDate=$T&toDate=$T&returnData=aligned5minRead&aggregateByType=true&returnAllTelemetry=true" \
            > /tmp/agg.json
          jq -c '.data.reads[] | {t:.type, n:(.intervalRead.intervalReads|length), last:(.intervalRead.intervalReads|map(select(.!=null))|.[-3:]), agg:.intervalRead.aggregateValue}' /tmp/agg.json \
            || head -c 1500 /tmp/agg.json
